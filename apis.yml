- aid: elastic:elastic-ccr-api
  name: Elastic Ccr API
  description: The cross-cluster replication (CCR) APIs let you run replication operations, such as creating
    and managing follower indices or auto-follow patterns. Use CCR to replicate indices across clusters
    to maintain search availability during outages, reduce indexing impact, and lower search latency by
    serving requests closer to users.
