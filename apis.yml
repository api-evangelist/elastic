  name: Elastic Cat API
  description: 'The compact and aligned text (CAT) APIs aim are intended only for human consumption using
    the Kibana console or command line. They are not intended for use by applications. For application
    consumption, it''s recommend to use a corresponding JSON API.


    All the cat commands accept a query string parameter `help` to see all the headers and info they provide,
    and the `/_cat` command alone lists all the available commands.'
