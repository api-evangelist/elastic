- aid: elastic:elastic-connector-api
  name: Elastic Connector API
  description: 'The connector and sync jobs APIs provide a convenient way to create and manage Elastic
    connectors and sync jobs in an internal index.


    Connectors are Elasticsearch integrations for syncing content from third-party data sources, which
    can be deployed on Elastic Cloud or hosted on your own infrastructure.


    This API provides an alternative to relying solely on Kibana UI for connector and sync job management.
    The API comes with a set of validations and assertions to ensure that the state representation in
    the internal index remains valid.


    This API requires the `manage_connector` privilege or, for read-only endpoints, the `monitor_connector`
    privilege.'
  humanURL: https://www.elastic.co/docs/api/doc/elasticsearch
  baseURL: https://api.elastic-cloud.com
