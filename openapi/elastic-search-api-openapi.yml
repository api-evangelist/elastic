openapi: 3.2.0
info:
  title: Elasticsearch REST Search API
  description: REST APIs for the Elasticsearch search and analytics engine. Provides operations for indexing documents, searching, managing indices, mappings, aliases, security, snapshots, and cluster administration. Used both by the Kibana UI and directly by client applications to ingest, search, and analyze data at scale.
  version: '9.0'
  contact:
    name: Elastic
    url: https://www.elastic.co
  license:
    name: Elastic License 2.0
    url: https://www.elastic.co/licensing/elastic-license
servers:
- url: https://{deployment}.es.{region}.cloud.es.io:9243
  description: Elastic Cloud deployment
  variables:
    deployment:
      default: my-deployment
      description: Deployment identifier
    region:
      default: us-east-1
      description: Cloud region
- url: http://localhost:9200
  description: Local Elasticsearch
security:
- apiKeyAuth: []
- basicAuth: []
tags:
- name: Search
  description: Search and query operations across indices.
paths:
  /_search:
    get:
      operationId: searchAllIndices
      summary: Search across all indices
      description: Returns search results across all indices in the cluster matching the supplied query parameters or request body.
      tags:
      - Search
      parameters:
      - name: q
        in: query
        description: Lucene query string
        schema:
          type: string
      - name: size
        in: query
        description: Number of hits to return
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /{index}/_search:
    get:
      operationId: searchIndex
      summary: Search a specific index
      description: Searches documents in the specified index using a query string or request body DSL.
      tags:
      - Search
      parameters:
      - name: index
        in: path
        required: true
        description: Index name or pattern
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
components:
  schemas:
    Document:
      type: object
      properties:
        _index:
          type: string
        _id:
          type: string
        _score:
          type: number
          nullable: true
        _source:
          type: object
          additionalProperties: true
    SearchResponse:
      type: object
      properties:
        took:
          type: integer
        timed_out:
          type: boolean
        hits:
          type: object
          properties:
            total:
              type: object
              properties:
                value:
                  type: integer
                relation:
                  type: string
            max_score:
              type: number
              nullable: true
            hits:
              type: array
              items:
                $ref: '#/components/schemas/Document'
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: ApiKey base64-encoded id:api_key
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Elasticsearch REST API Reference
  url: https://www.elastic.co/docs/api/doc/elasticsearch
