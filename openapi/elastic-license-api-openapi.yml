components:
  schemas:
    _types.DateTime:
      description: 'A date and time, either as a string whose format can depend on the context (defaulting to ISO 8601), or a

        number of milliseconds since the Epoch. Elasticsearch accepts both as input, but will generally output a string

        representation.'
      oneOf:
      - type: string
      - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
    _types.UnitMillis:
      description: Time unit for milliseconds
      type: number
    _types.Uuid:
      type: string
    license._types.LicenseStatus:
      type: string
      enum:
      - active
      - valid
      - invalid
      - expired
    _types.AcknowledgedResponseBase:
      type: object
      properties:
        acknowledged:
          description: For a successful response, this value is always true. On failure, an exception is returned instead.
          type: boolean
      required:
      - acknowledged
    _types.Duration:
      externalDocs:
        url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/api-conventions#time-units
      description: 'A duration. Units can be `nanos`, `micros`, `ms` (milliseconds), `s` (seconds), `m` (minutes), `h` (hours) and

        `d` (days). Also accepts "0" without a unit and "-1" to indicate an unspecified value.'
      oneOf:
      - type: string
      - type: string
        enum:
        - '-1'
      - type: string
        enum:
        - '0'
    license.post.Acknowledgement:
      type: object
      properties:
        license:
          type: array
          items:
            type: string
        message:
          type: string
      required:
      - license
      - message
    license._types.License:
      type: object
      properties:
        expiry_date_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        issue_date_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        start_date_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        issued_to:
          type: string
        issuer:
          type: string
        max_nodes:
          oneOf:
          - type: number
          - type:
            - string
            - 'null'
        max_resource_units:
          type: number
        signature:
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/license._types.LicenseType'
        uid:
          type: string
      required:
      - expiry_date_in_millis
      - issue_date_in_millis
      - issued_to
      - issuer
      - signature
      - type
      - uid
    license.get.LicenseInformation:
      type: object
      properties:
        expiry_date:
          allOf:
          - $ref: '#/components/schemas/_types.DateTime'
        expiry_date_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        issue_date:
          allOf:
          - $ref: '#/components/schemas/_types.DateTime'
        issue_date_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        issued_to:
          type: string
        issuer:
          type: string
        max_nodes:
          oneOf:
          - type: number
          - type:
            - string
            - 'null'
        max_resource_units:
          oneOf:
          - type: number
          - type:
            - string
            - 'null'
        status:
          allOf:
          - $ref: '#/components/schemas/license._types.LicenseStatus'
        type:
          allOf:
          - $ref: '#/components/schemas/license._types.LicenseType'
        uid:
          allOf:
          - $ref: '#/components/schemas/_types.Uuid'
        start_date_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
      required:
      - issue_date
      - issue_date_in_millis
      - issued_to
      - issuer
      - max_nodes
      - status
      - type
      - uid
      - start_date_in_millis
    license._types.LicenseType:
      type: string
      enum:
      - missing
      - trial
      - basic
      - standard
      - dev
      - silver
      - gold
      - platinum
      - enterprise
    _types.EpochTimeUnitMillis:
      allOf:
      - $ref: '#/components/schemas/_types.UnitMillis'
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Elasticsearch APIs support key-based authentication.\nYou must create an API key and use the encoded value in the request header.\nFor example:\n\n```\ncurl -X GET \"${ES_URL}/_cat/indices?v=true\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n```\n\nTo get API keys, use the `/_security/api_key` APIs."
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Elasticsearch APIs support the use of bearer tokens in the `Authorization` HTTP header to authenticate with the API.

        For examples, refer to [Token-based authentication services](https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/token-based-authentication-services)'
