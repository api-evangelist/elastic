  /_license/start_basic:
    post:
      tags:
      - License
      summary: Start a basic license
      description: 'Start an indefinite basic license, which gives access to all the basic features.


        NOTE: In order to start a basic license, you must not currently have a basic license.


        If the basic license does not support all of the features that are available with your current license, however, you are notified in the response.

        You must then re-submit the API request with the `acknowledge` parameter set to `true`.


        To check the status of your basic license, use the get basic license API.'
      operationId: license-post-start-basic
      parameters:
      - in: query
        name: acknowledge
        description: Whether the user has acknowledged acknowledge messages
        deprecated: false
        schema:
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node.
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: Period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                  basic_was_started:
                    type: boolean
                  error_message:
                    type: string
                  type:
                    allOf:
                    - $ref: '#/components/schemas/license._types.LicenseType'
                  acknowledge:
                    type: object
                    additionalProperties:
                      oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                required:
                - acknowledged
                - basic_was_started
              examples:
                StartBasicLicenseResponseExample1:
