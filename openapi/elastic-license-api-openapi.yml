openapi: 3.2.0
info:
  title: Elasticsearch License API
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the main branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: License
  description: Licensing APIs enable you to manage your licenses.
  externalDocs:
    description: Learn more.
    url: https://www.elastic.co/subscriptions
  x-displayName: Licensing
paths:
  /_license:
    get:
      tags:
      - License
      summary: Get license information
      description: 'Get information about your Elastic license including its type, its status, when it was issued, and when it expires.


        >info

        > If the master node is generating a new cluster state, the get license API may return a `404 Not Found` response.

        > If you receive an unexpected 404 response after cluster startup, wait a short period and retry the request.'
      operationId: license-get
      parameters:
      - in: query
        name: accept_enterprise
        description: 'If `true`, this parameter returns enterprise for Enterprise license types. If `false`, this parameter returns platinum for both platinum and enterprise license types. This behavior is maintained for backwards compatibility.

          This parameter is deprecated and will always be set to true in 8.x.'
        deprecated: true
        schema:
          type: boolean
        style: form
      - in: query
        name: local
        description: 'Specifies whether to retrieve local information.

          From 9.2 onwards the default value is `true`, which means the information is retrieved from the responding node.

          In earlier versions the default is `false`, which means the information is retrieved from the elected master node.'
        deprecated: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  license:
                    allOf:
                    - $ref: '#/components/schemas/license.get.LicenseInformation'
                required:
                - license
              examples:
                GetLicenseResponseExample1:
                  description: A successful response from `GET /_license`.
                  value: "{\n  \"license\" : {\n    \"status\" : \"active\",\n    \"uid\" : \"cbff45e7-c553-41f7-ae4f-9205eabd80xx\",\n    \"type\" : \"trial\",\n    \"issue_date\" : \"2018-10-20T22:05:12.332Z\",\n    \"issue_date_in_millis\" : 1540073112332,\n    \"expiry_date\" : \"2018-11-19T22:05:12.332Z\",\n    \"expiry_date_in_millis\" : 1542665112332,\n    \"max_nodes\" : 1000,\n    \"max_resource_units\" : null,\n    \"issued_to\" : \"test\",\n    \"issuer\" : \"elasticsearch\",\n    \"start_date_in_millis\" : -1\n  }\n}"
      x-state: Generally available
      x-variations:
      - "<div>\n              <span class=\"operation-verb get\">GET</span>\n              <span class=\"operation-path\">/_license</span>\n              </div>\n            "
      x-api: get.license
      x-category: info
      x-codeSamples:
      - lang: Console
        source: 'GET /_license

          '
      - lang: Python
        source: resp = client.license.get()
      - lang: JavaScript
        source: const response = await client.license.get();
      - lang: Ruby
        source: response = client.license.get
      - lang: PHP
        source: $resp = $client->license()->get();
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_license"'
      - lang: Java
        source: 'client.license().get(g -> g);

          '
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    put:
      tags:
      - License
      summary: Update the license
      description: 'You can update your license at runtime without shutting down your nodes.

        License updates take effect immediately.

        If the license you are installing does not support all of the features that were available with your previous license, however, you are notified in the response.

        You must then re-submit the API request with the acknowledge parameter set to true.


        NOTE: If Elasticsearch security features are enabled and you are installing a gold or higher license, you must enable TLS on the transport networking layer before you install the license.

        If the operator privileges feature is enabled, only operator users can use this API.'
      operationId: license-post
      parameters:
      - in: query
        name: acknowledge
        description: Specifies whether you acknowledge the license changes.
        deprecated: false
        schema:
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: The period to wait for a connection to the master node.
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: The period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                license:
                  allOf:
                  - $ref: '#/components/schemas/license._types.License'
                licenses:
                  description: A sequence of one or more JSON documents containing the license information.
                  type: array
                  items:
                    $ref: '#/components/schemas/license._types.License'
            examples:
              PostLicenseRequestExample1:
                description: 'Run `PUT _license` to update to a basic license. NOTE: These values are invalid; you must substitute the appropriate contents from your license file.

                  '
                value: "{\n  \"licenses\": [\n    {\n      \"uid\":\"893361dc-9749-4997-93cb-802e3d7fa4xx\",\n      \"type\":\"basic\",\n      \"issue_date_in_millis\":1411948800000,\n      \"expiry_date_in_millis\":1914278399999,\n      \"max_nodes\":1,\n      \"issued_to\":\"issuedTo\",\n      \"issuer\":\"issuer\",\n      \"signature\":\"xx\"\n    }\n    ]\n}"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledge:
                    allOf:
                    - $ref: '#/components/schemas/license.post.Acknowledgement'
                  acknowledged:
                    type: boolean
                  license_status:
                    allOf:
                    - $ref: '#/components/schemas/license._types.LicenseStatus'
                required:
                - acknowledged
                - license_status
              examples:
                PostLicenseResponseExample1:
                  description: If you update to a basic license and you previously had a license with more features, you receive this type of response. You must re-submit the API request and set the `acknowledge` parameter to `true`.
                  value: "{\n  \"acknowledged\": false,\n  \"license_status\": \"valid\",\n  \"acknowledge\": {\n    \"message\": \"\\\"\\\"\\\"This license update requires acknowledgement. To acknowledge the license, please read the following messages and update the license again, this time with the \\\"acknowledge=true\\\" parameter:\\\"\\\"\\\"\",\n    \"watcher\": [\n      \"Watcher will be disabled\"\n    ],\n    \"logstash\": [\n      \"Logstash will no longer poll for centrally-managed pipelines\"\n    ],\n    \"security\": [\n      \"The following X-Pack security functionality will be disabled ...\"\n    ]\n  }\n}"
      x-state: Generally available
      x-variations:
      - "<div>\n              <span class=\"operation-verb put\">PUT</span>\n              <span class=\"operation-path\">/_license</span>\n              </div>\n            "
      - "<div>\n              <span class=\"operation-verb post\">POST</span>\n              <span class=\"operation-path\">/_license</span>\n              </div>\n            "
      x-req-auth:
      - 'Cluster privileges: `manage`

        '
      x-api: post.license
      x-category: info
      x-codeSamples:
      - lang: Console
        source: "PUT _license\n{\n  \"licenses\": [\n    {\n      \"uid\":\"893361dc-9749-4997-93cb-802e3d7fa4xx\",\n      \"type\":\"basic\",\n      \"issue_date_in_millis\":1411948800000,\n      \"expiry_date_in_millis\":1914278399999,\n      \"max_nodes\":1,\n      \"issued_to\":\"issuedTo\",\n      \"issuer\":\"issuer\",\n      \"signature\":\"xx\"\n    }\n    ]\n}"
      - lang: Python
        source: "resp = client.license.post(\n    licenses=[\n        {\n            \"uid\": \"893361dc-9749-4997-93cb-802e3d7fa4xx\",\n            \"type\": \"basic\",\n            \"issue_date_in_millis\": 1411948800000,\n            \"expiry_date_in_millis\": 1914278399999,\n            \"max_nodes\": 1,\n            \"issued_to\": \"issuedTo\",\n            \"issuer\": \"issuer\",\n            \"signature\": \"xx\"\n        }\n    ],\n)"
      - lang: JavaScript
        source: "const response = await client.license.post({\n  licenses: [\n    {\n      uid: \"893361dc-9749-4997-93cb-802e3d7fa4xx\",\n      type: \"basic\",\n      issue_date_in_millis: 1411948800000,\n      expiry_date_in_millis: 1914278399999,\n      max_nodes: 1,\n      issued_to: \"issuedTo\",\n      issuer: \"issuer\",\n      signature: \"xx\",\n    },\n  ],\n});"
      - lang: Ruby
        source: "response = client.license.post(\n  body: {\n    \"licenses\": [\n      {\n        \"uid\": \"893361dc-9749-4997-93cb-802e3d7fa4xx\",\n        \"type\": \"basic\",\n        \"issue_date_in_millis\": 1411948800000,\n        \"expiry_date_in_millis\": 1914278399999,\n        \"max_nodes\": 1,\n        \"issued_to\": \"issuedTo\",\n        \"issuer\": \"issuer\",\n        \"signature\": \"xx\"\n      }\n    ]\n  }\n)"
      - lang: PHP
        source: "$resp = $client->license()->post([\n    \"body\" => [\n        \"licenses\" => array(\n            [\n                \"uid\" => \"893361dc-9749-4997-93cb-802e3d7fa4xx\",\n                \"type\" => \"basic\",\n                \"issue_date_in_millis\" => 1411948800000,\n                \"expiry_date_in_millis\" => 1914278399999,\n                \"max_nodes\" => 1,\n                \"issued_to\" => \"issuedTo\",\n                \"issuer\" => \"issuer\",\n                \"signature\" => \"xx\",\n            ],\n        ),\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"licenses":[{"uid":"893361dc-9749-4997-93cb-802e3d7fa4xx","type":"basic","issue_date_in_millis":1411948800000,"expiry_date_in_millis":1914278399999,"max_nodes":1,"issued_to":"issuedTo","issuer":"issuer","signature":"xx"}]}'' "$ELASTICSEARCH_URL/_license"'
      - lang: Java
        source: "client.license().post(p -> p\n    .licenses(l -> l\n        .expiryDateInMillis(1914278399999L)\n        .issueDateInMillis(1411948800000L)\n        .issuedTo(\"issuedTo\")\n        .issuer(\"issuer\")\n        .maxNodes(1L)\n        .signature(\"xx\")\n        .type(LicenseType.Basic)\n        .uid(\"893361dc-9749-4997-93cb-802e3d7fa4xx\")\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    post:
      tags:
      - License
      summary: Update the license
      description: 'You can update your license at runtime without shutting down your nodes.

