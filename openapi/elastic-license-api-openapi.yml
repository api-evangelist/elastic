      - lang: PHP
        source: "$resp = $client->license()->post([\n    \"body\" => [\n        \"licenses\" => array(\n            [\n                \"uid\" => \"893361dc-9749-4997-93cb-802e3d7fa4xx\",\n                \"type\" => \"basic\",\n                \"issue_date_in_millis\" => 1411948800000,\n                \"expiry_date_in_millis\" => 1914278399999,\n                \"max_nodes\" => 1,\n                \"issued_to\" => \"issuedTo\",\n                \"issuer\" => \"issuer\",\n                \"signature\" => \"xx\",\n            ],\n        ),\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"licenses":[{"uid":"893361dc-9749-4997-93cb-802e3d7fa4xx","type":"basic","issue_date_in_millis":1411948800000,"expiry_date_in_millis":1914278399999,"max_nodes":1,"issued_to":"issuedTo","issuer":"issuer","signature":"xx"}]}'' "$ELASTICSEARCH_URL/_license"'
      - lang: Java
        source: "client.license().post(p -> p\n    .licenses(l -> l\n        .expiryDateInMillis(1914278399999L)\n        .issueDateInMillis(1411948800000L)\n        .issuedTo(\"issuedTo\")\n        .issuer(\"issuer\")\n        .maxNodes(1L)\n        .signature(\"xx\")\n        .type(LicenseType.Basic)\n        .uid(\"893361dc-9749-4997-93cb-802e3d7fa4xx\")\n    )\n);\n"
