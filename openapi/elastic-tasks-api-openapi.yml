        source: "response = client.tasks.cancel(\n  task_id: \"<task_id>\"\n)"
      - lang: PHP
        source: "$resp = $client->tasks()->cancel([\n    \"task_id\" => \"<task_id>\",\n]);"
      - lang: curl
