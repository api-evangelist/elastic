openapi: 3.2.0
info:
  title: Elasticsearch Tasks API
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the main branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: Tasks
  description: The task management APIs enable you to get information about the tasks currently running on one or more nodes in the cluster.
  externalDocs:
    description: Learn more.
    url: https://www.elastic.co/docs/troubleshoot/elasticsearch/task-queue-backlog
  x-displayName: Task management
paths:
  /_tasks/_cancel:
    post:
      tags:
      - Tasks
      summary: Cancel a task
      description: 'WARNING: The task management API is new and should still be considered a beta feature.

        The API may change in ways that are not backwards compatible.


        A task may continue to run for some time after it has been cancelled because it may not be able to safely stop its current activity straight away.

        It is also possible that Elasticsearch must complete its work on other tasks before it can process the cancellation.

        The get task information API will continue to list these cancelled tasks until they complete.

        The cancelled flag in the response indicates that the cancellation command has been processed and the task will stop as soon as possible.


        To troubleshoot why a cancelled task does not complete promptly, use the get task information API with the `?detailed` parameter to identify the other tasks the system is running.

        You can also use the node hot threads API to obtain detailed information about the work the system is doing instead of completing the cancelled task.'
      operationId: tasks-cancel
      parameters:
      - in: query
        name: actions
        description: A comma-separated list or wildcard expression of actions that is used to limit the request.
        deprecated: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        style: form
      - in: query
        name: nodes
        description: A comma-separated list of node IDs or names that is used to limit the request.
        deprecated: false
        schema:
          type: array
          items:
            type: string
        style: form
      - in: query
        name: parent_task_id
        description: A parent task ID that is used to limit the tasks.
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: wait_for_completion
        description: If true, the request blocks until all found tasks are complete.
        deprecated: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tasks._types.TaskListResponseBase'
      x-state: Technical preview; Added in 2.3.0
      x-variations:
      - "<div>\n              <span class=\"operation-verb post\">POST</span>\n              <span class=\"operation-path\">/_tasks/_cancel</span>\n              </div>\n            "
      x-req-auth:
      - 'Cluster privileges: `manage`

        '
      x-api: cancel.tasks
      x-category: info
      x-codeSamples:
      - lang: Console
        source: 'POST _tasks/<task_id>/_cancel

          '
      - lang: Python
        source: "resp = client.tasks.cancel(\n    task_id=\"<task_id>\",\n)"
      - lang: JavaScript
        source: "const response = await client.tasks.cancel({\n  task_id: \"<task_id>\",\n});"
      - lang: Ruby
        source: "response = client.tasks.cancel(\n  task_id: \"<task_id>\"\n)"
      - lang: PHP
        source: "$resp = $client->tasks()->cancel([\n    \"task_id\" => \"<task_id>\",\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_tasks/<task_id>/_cancel"'
      - lang: Java
        source: "client.tasks().cancel(c -> c\n    .taskId(\"<task_id>\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
