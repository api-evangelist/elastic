openapi: 3.2.0
info:
  title: Elasticsearch REST Indices API
  description: REST APIs for the Elasticsearch search and analytics engine. Provides operations for indexing documents, searching, managing indices, mappings, aliases, security, snapshots, and cluster administration. Used both by the Kibana UI and directly by client applications to ingest, search, and analyze data at scale.
  version: '9.0'
  contact:
    name: Elastic
    url: https://www.elastic.co
  license:
    name: Elastic License 2.0
    url: https://www.elastic.co/licensing/elastic-license
servers:
- url: https://{deployment}.es.{region}.cloud.es.io:9243
  description: Elastic Cloud deployment
  variables:
    deployment:
      default: my-deployment
      description: Deployment identifier
    region:
      default: us-east-1
      description: Cloud region
- url: http://localhost:9200
  description: Local Elasticsearch
security:
- apiKeyAuth: []
- basicAuth: []
tags:
- name: Indices
  description: Manage indices, mappings, and settings.
paths:
  /{index}:
    put:
      operationId: createIndex
      summary: Create an index
      tags:
      - Indices
      parameters:
      - name: index
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  additionalProperties: true
                mappings:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Created
    delete:
      operationId: deleteIndex
      summary: Delete an index
      tags:
      - Indices
      parameters:
      - name: index
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: ApiKey base64-encoded id:api_key
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Elasticsearch REST API Reference
  url: https://www.elastic.co/docs/api/doc/elasticsearch
