openapi: 3.2.0
info:
  title: Kibana Spaces API
  description: REST APIs for managing Kibana resources such as data views, saved objects, connectors, alerts, and Spaces. Calls are stateless; each request must be authenticated and include any required Kibana version header.
  version: '9.0'
  contact:
    name: Elastic
    url: https://www.elastic.co
  license:
    name: Elastic License 2.0
    url: https://www.elastic.co/licensing/elastic-license
servers:
- url: https://{deployment}.kb.{region}.cloud.es.io:9243
  description: Elastic Cloud Kibana
  variables:
    deployment:
      default: my-deployment
    region:
      default: us-east-1
- url: http://localhost:5601
  description: Local Kibana
security:
- apiKeyAuth: []
- basicAuth: []
tags:
- name: Spaces
  description: Manage Kibana Spaces.
paths:
  /api/spaces/space:
    get:
      operationId: listSpaces
      summary: List Kibana Spaces
      tags:
      - Spaces
      responses:
        '200':
          description: Spaces list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
components:
  schemas:
    Space:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Kibana API Reference
  url: https://www.elastic.co/docs/api/doc/kibana
