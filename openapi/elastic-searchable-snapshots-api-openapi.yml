openapi: 3.2.0
info:
  title: Elasticsearch Searchable Snapshots API
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the main branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: searchable_snapshots
  description: The searchable snapshots APIs are used to mount snapshots as searchable indices.
  externalDocs:
    description: Learn more.
    url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/searchable-snapshots
  x-displayName: Searchable snapshots
paths:
  /_searchable_snapshots/cache/stats:
    get:
      tags:
      - searchable_snapshots
      summary: Get cache statistics
      description: Get statistics about the shared cache for partially mounted indices.
      externalDocs:
        description: Searchable snapshots
        url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/searchable-snapshots
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/searchable-snapshots-api-cache-stats.html
      operationId: searchable-snapshots-cache-stats
      parameters:
      - in: query
        name: master_timeout
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/searchable_snapshots.cache_stats.Node'
                required:
                - nodes
              examples:
                CacheStatsResponseExample1:
                  description: A successful response from `GET /_searchable_snapshots/cache/stats`.
                  value: "{\n  \"nodes\" : {\n    \"eerrtBMtQEisohZzxBLUSw\" : {\n      \"shared_cache\" : {\n        \"reads\" : 6051, // The number of cache region read operations. If reads > writes, the difference represents requests successfully served from the cache without accessing the snapshot repository.\n        \"bytes_read_in_bytes\" : 5448829,\n        \"writes\" : 37, // The number of cache region write operations. If reads == writes, every request required fetching data from the snapshot repository into the cache.\n        \"bytes_written_in_bytes\" : 1208320,\n        \"evictions\" : 5, // The number of cache region evictions. A low eviction count indicates the cache is effectively serving requests. Use this metric to evaluate cache sizing.\n        \"num_regions\" : 65536,\n        \"size_in_bytes\" : 1099511627776,\n        \"region_size_in_bytes\" : 16777216 // The size of each cache region. A region is a contiguous byte range stored on local disk.\n      }\n    }\n  }\n}"
      x-state: Technical preview; Added in 7.13.0
      x-variations:
      - "<div>\n              <span class=\"operation-verb get\">GET</span>\n              <span class=\"operation-path\">/_searchable_snapshots/cache/stats</span>\n              </div>\n            "
      x-req-auth:
      - 'Cluster privileges: `manage`

        '
      x-api: cache_stats.searchable_snapshots
      x-category: management
      x-codeSamples:
      - lang: Console
        source: 'GET /_searchable_snapshots/cache/stats

          '
      - lang: Python
        source: resp = client.searchable_snapshots.cache_stats()
      - lang: JavaScript
        source: const response = await client.searchableSnapshots.cacheStats();
      - lang: Ruby
        source: response = client.searchable_snapshots.cache_stats
      - lang: PHP
        source: $resp = $client->searchableSnapshots()->cacheStats();
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_searchable_snapshots/cache/stats"'
      - lang: Java
        source: 'client.searchableSnapshots().cacheStats(c -> c);

          '
      x-metaTags:
      - content: Elasticsearch
        name: product_name
